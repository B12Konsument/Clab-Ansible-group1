---
- name: Lernfeld-Anforderungen an die laufende Gerätekonfiguration prüfen
  hosts: routers:switches
  gather_facts: false
  vars:
    vlan_ids: [10, 20, 30, 99]
    # Ethernet0/0 wird vom Lab für den Ansible-Bootstrap tatsächlich benutzt.
    used_switch_ports: [Ethernet0/0, Ethernet0/1, Ethernet0/2, Ethernet0/3, Ethernet1/0, Ethernet1/1]
  tasks:
    - name: Laufende Konfiguration lesen (enthält Passwörter, deshalb keine Ausgabe)
      cisco.ios.ios_command:
        commands:
          - show running-config
          - show ip ssh
      register: running
      no_log: true

    - name: Hostname gegen die Ansible-Vorlage prüfen
      vars:
        device_prefix: "{{ 'R1' if inventory_hostname in groups['routers'] else 'S1' }}"
        expected_hostname: "{{ device_prefix }}-{{ franchise_name | upper | replace(' ', '-') }}"
      ansible.builtin.assert:
        that:
          - "running.stdout[0] is search('(?m)^hostname ' ~ (expected_hostname | regex_escape) ~ '$')"
        fail_msg: "Der laufende Hostname entspricht nicht der Ansible-Vorlage: {{ expected_hostname }}."
      register: hostname_check
      ignore_errors: true

    - name: Domäne, SSHv2, MOTD und unverschlüsselte Passwörter prüfen
      ansible.builtin.assert:
        that:
          - "running.stdout[0] is search('(?m)^ip domain(?: name|-name) echt-hamburg\\.de$')"
          - "'SSH Enabled - version 2.0' in running.stdout[1]"
          - "'service password-encryption' not in running.stdout[0].splitlines()"
          - "running.stdout[0] is search('(?m)^enable password (?:0 )?' ~ (enable_password | regex_escape) ~ '$')"
          - "running.stdout[0] is search('(?m)^username netadmin privilege 15 password (?:0 )?\\S+$')"
          - >-
            running.stdout[0] is search('(?ms)^banner motd (\S+)\n(?:(?!\1).)*'
            ~ (franchise_name | regex_escape) ~ ' \| ' ~ (group_name | regex_escape))
          - "running.stdout[0] is search('(?ms)^line vty 0 4\n(?:(?!^!).)* login local\n(?:(?!^!).)* transport input ssh')"
        fail_msg: Domäne, SSH, Banner oder Projekt-Passwörter entsprechen nicht den Vorgaben.
      register: basics
      ignore_errors: true

    - name: Auch zusätzliche Benutzer- und Enable-Passwörter auf Klartext prüfen
      ansible.builtin.assert:
        that:
          - "running.stdout[0] is not search('(?m)^(?:enable secret |username \\S+[^\\n]* secret )')"
          - "running.stdout[0] is not search('(?m)^(?:enable |username \\S+[^\\n]* |[ \\t]+)password [1-9][0-9]* ')"
        fail_msg: >-
          Es sind noch secret-Einträge oder verschlüsselte Passwörter vorhanden.
          no service password-encryption wandelt vorhandene Einträge nicht in Klartext um.
      register: passwords
      ignore_errors: true

    - name: VLANs, Access-Ports und Trunk des Switches prüfen
      when: inventory_hostname in groups['switches']
      ansible.builtin.assert:
        that:
          - "running.stdout[0] is search('(?m)^vlan ' ~ (item.vlan | string) ~ '$')"
          - >-
            running.stdout[0] is search('(?ms)^interface ' ~ item.port
            ~ '\n(?:(?!^!).)* switchport access vlan ' ~ (item.vlan | string) ~ '\n(?:(?!^!).)* switchport mode access')
          - >-
            running.stdout[0] is search('(?ms)^interface Ethernet0/1\n(?:(?!^!).)* switchport trunk allowed vlan 10,20,30,99\n(?:(?!^!).)* switchport mode trunk')
          - >-
            running.stdout[0] is search('(?ms)^interface Vlan99\n(?:(?!^!).)* ip address 192\.168\.99\.2 255\.255\.255\.0')
        fail_msg: VLAN-Zuordnung, Trunk oder Management-SVI ist nicht wie geplant konfiguriert.
      loop:
        - {vlan: 10, port: Ethernet0/2}
        - {vlan: 20, port: Ethernet0/3}
        - {vlan: 30, port: Ethernet1/0}
        - {vlan: 99, port: Ethernet1/1}
      register: vlans
      ignore_errors: true

    - name: Alle vorhandenen unbenutzten Switch-Ports auf shutdown prüfen
      when: inventory_hostname in groups['switches'] and item.0 not in used_switch_ports
      ansible.builtin.assert:
        that: "item.1 is search('(?m)^ shutdown$')"
        fail_msg: "Ungenutzter Port {{ item.0 }} ist nicht administrativ deaktiviert."
      loop: "{{ running.stdout[0] | regex_findall('(?ms)^interface (Ethernet[0-9]+/[0-9]+)\\n(.*?)(?=^!|^interface |\\Z)') }}"
      loop_control:
        label: "{{ item.0 }}"
      register: ports
      ignore_errors: true

    - name: DHCP-Pools auf dem Router inklusive Netz, Gateway und Domäne prüfen
      when: inventory_hostname in groups['routers']
      ansible.builtin.assert:
        that:
          - >-
            running.stdout[0] is search('(?ms)^ip dhcp pool \S+\n(?:(?!^!).)* network 192\.168\.'
            ~ (item | string) ~ '\.0 255\.255\.255\.0\n(?:(?!^!).)* default-router 192\.168\.'
            ~ (item | string) ~ '\.1[ \t]*\n(?:(?!^!).)* domain-name echt-hamburg\.de')
          - >-
            running.stdout[0] is search('(?m)^ip dhcp excluded-address 192\.168\.' ~ (item | string) ~ '\.1(?: |$)')
          - >-
            running.stdout[0] is search('(?ms)^interface Ethernet0/1\.' ~ (item | string)
            ~ '\n(?:(?!^!).)* encapsulation dot1Q ' ~ (item | string)
            ~ '\n(?:(?!^!).)* ip address 192\.168\.' ~ (item | string) ~ '\.1 255\.255\.255\.0')
        fail_msg: DHCP-Pool oder statische erste Gateway-Adresse stimmt nicht mit dem aktuellen VLAN-Adressplan überein.
      loop: "{{ vlan_ids }}"
      register: pools
      ignore_errors: true

    - name: Öffentliche IP, Netzmaske und NAT-Konfiguration prüfen
      when: inventory_hostname in groups['routers']
      ansible.builtin.assert:
        that:
          - >-
            running.stdout[0] is search('(?ms)^interface Ethernet0/2\n(?:(?!^!).)* ip address 200\.108\.1\.1 255\.255\.255\.240\n(?:(?!^!).)* ip nat outside')
          - "'ip nat inside source list 1 interface Ethernet0/2 overload' in running.stdout[0]"
          - "running.stdout[0] | regex_findall('(?m)^ ip nat inside$') | length == 4"
          - "'ip dhcp excluded-address 192.168.99.1 192.168.99.2' in running.stdout[0]"
        fail_msg: Öffentlicher Uplink, NAT-Zuordnung oder Reservierung der Management-Adressen fehlt.
      register: uplink
      ignore_errors: true

    - name: Adressbereich aus Lernfeld-Vorgaben.txt prüfen
      when: inventory_hostname in groups['routers']
      ansible.builtin.assert:
        that:
          - "running.stdout[0] | regex_findall('(?m)^ network 192\\.168\\.108\\.[0-9]+ ') | length == 4"
        fail_msg: >-
          Vorgabe ist 192.168.108.0/24, aufgeteilt auf vier VLAN-Subnetze.
          Die aktuellen Netze 192.168.10.0/24, .20.0/24, .30.0/24 und .99.0/24 erfüllen das nicht.
          Adressplan mit dem Lehrerteam klären; bei Umstellung auch die Test-Sollwerte anpassen.
      register: address_range
      ignore_errors: true

    - name: Gesamtergebnis der Konfigurationsprüfung
      ansible.builtin.assert:
        that: >-
          [hostname_check, basics, passwords, vlans, ports, pools, uplink, address_range]
          | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
        fail_msg: Mindestens eine Konfigurationsanforderung ist nicht erfüllt; siehe Einzelprüfungen oben.

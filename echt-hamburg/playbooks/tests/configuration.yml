---
- name: Lernfeld-Anforderungen an die laufende Gerätekonfiguration prüfen
  hosts: routers:switches
  gather_facts: false
  vars:
    # Ethernet0/0 wird vom Lab für den Ansible-Bootstrap tatsächlich benutzt.
    used_switch_ports: "{{ switch_bootstrap_ports + [switch_trunk_port] + (vlans | map(attribute='switch_port') | list) }}"
  tasks:
    - name: Adressplan unabhängig gegen die Lernfeld-Vorgaben prüfen
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../../scripts/validate-settings.py", "{{ playbook_dir }}/../group_vars.yml"]
      delegate_to: localhost
      vars:
        ansible_connection: local
      changed_when: false
      run_once: true

    - name: Laufende Konfiguration lesen (enthält Passwörter, deshalb keine Ausgabe)
      cisco.ios.ios_command:
        commands:
          - show running-config
          - show ip ssh
      register: running
      no_log: true

    - name: Hostname gegen die Ansible-Vorlage prüfen
      vars:
        device_prefix: "{{ 'R1' if inventory_hostname in groups['routers'] else 'S1' }}"
        expected_hostname: "{{ device_prefix }}-{{ franchise_name | upper | replace(' ', '-') }}"
      ansible.builtin.assert:
        that:
          - "running.stdout[0] is search('(?m)^hostname ' ~ (expected_hostname | regex_escape) ~ '$')"
        fail_msg: "Der laufende Hostname entspricht nicht der Ansible-Vorlage: {{ expected_hostname }}."
      register: hostname_check
      ignore_errors: true

    - name: Domäne, SSHv2, MOTD und unverschlüsselte Passwörter prüfen
      ansible.builtin.assert:
        that:
          - "running.stdout[0] is search('(?m)^ip domain(?: name|-name) echt-hamburg\\.de$')"
          - "'SSH Enabled - version 2.0' in running.stdout[1]"
          - "'service password-encryption' not in running.stdout[0].splitlines()"
          - "running.stdout[0] is search('(?m)^enable password (?:0 )?' ~ (enable_password | regex_escape) ~ '$')"
          - "running.stdout[0] is search('(?m)^username netadmin privilege 15 password (?:0 )?\\S+$')"
          - >-
            running.stdout[0] is search('(?ms)^banner motd (\S+)\n(?:(?!\1).)*'
            ~ (franchise_name | regex_escape) ~ ' \| ' ~ (group_name | regex_escape))
          - "running.stdout[0] is search('(?ms)^line vty 0 4\n(?:(?!^!).)* login local\n(?:(?!^!).)* transport input ssh')"
        fail_msg: Domäne, SSH, Banner oder Projekt-Passwörter entsprechen nicht den Vorgaben.
      register: basics
      ignore_errors: true

    - name: Bootstrap-Administrator bleibt für spätere Ansible-Läufe erhalten
      ansible.builtin.assert:
        that:
          - "running.stdout[0] is search('(?m)^username admin privilege 15 password (?:0 )?admin$')"
        fail_msg: Der Bootstrap-Zugang admin fehlt oder wurde verändert; erneute Ansible-Läufe wären nicht möglich.
      register: bootstrap
      ignore_errors: true

    - name: Auch zusätzliche Benutzer- und Enable-Passwörter auf Klartext prüfen
      ansible.builtin.assert:
        that:
          - "running.stdout[0] is not search('(?m)^(?:enable secret |username \\S+[^\\n]* secret )')"
          - "running.stdout[0] is not search('(?m)^(?:enable |username \\S+[^\\n]* |[ \\t]+)password [1-9][0-9]* ')"
        fail_msg: >-
          Es sind noch secret-Einträge oder verschlüsselte Passwörter vorhanden.
          no service password-encryption wandelt vorhandene Einträge nicht in Klartext um.
      register: passwords
      ignore_errors: true

    - name: VLANs, Access-Ports und Trunk des Switches prüfen
      when: inventory_hostname in groups['switches']
      ansible.builtin.assert:
        that:
          - "running.stdout[0] is search('(?m)^vlan ' ~ (item.id | string) ~ '$')"
          - >-
            running.stdout[0] is search('(?ms)^interface ' ~ (item.switch_port | regex_escape)
            ~ '\n(?:(?!^!).)* switchport access vlan ' ~ (item.id | string) ~ '\n(?:(?!^!).)* switchport mode access')
          - >-
            running.stdout[0] is search('(?ms)^interface ' ~ (switch_trunk_port | regex_escape) ~ '\n(?:(?!^!).)* switchport trunk allowed vlan ' ~ (vlans | map(attribute='id') | join(',')) ~ '\n(?:(?!^!).)* switchport mode trunk')
          - >-
            running.stdout[0] is search('(?ms)^interface Vlan99\n(?:(?!^!).)* ip address ' ~ (switch_management_ip | regex_escape) ~ ' ' ~ (lan_netmask | regex_escape))
        fail_msg: VLAN-Zuordnung, Trunk oder Management-SVI ist nicht wie geplant konfiguriert.
      loop: "{{ vlans }}"
      register: vlan_check
      ignore_errors: true

    - name: Alle vorhandenen unbenutzten Switch-Ports auf shutdown prüfen
      when: inventory_hostname in groups['switches'] and item.0 not in used_switch_ports
      ansible.builtin.assert:
        that: "item.1 is search('(?m)^ shutdown$')"
        fail_msg: "Ungenutzter Port {{ item.0 }} ist nicht administrativ deaktiviert."
      loop: "{{ running.stdout[0] | regex_findall('(?ms)^interface (Ethernet[0-9]+/[0-9]+)\\n(.*?)(?=^!|^interface |\\Z)') }}"
      loop_control:
        label: "{{ item.0 }}"
      register: ports
      ignore_errors: true

    - name: DHCP-Pools und erste Gateway-Adresse jedes VLANs prüfen
      when: inventory_hostname in groups['routers']
      ansible.builtin.assert:
        that:
          - >-
            running.stdout[0] is search('(?ms)^ip dhcp pool ' ~ (item.name | regex_escape)
            ~ '\n(?:(?!^!).)* network ' ~ (item.network | regex_escape) ~ ' ' ~ (lan_netmask | regex_escape)
            ~ '\n(?:(?!^!).)* default-router ' ~ (item.gateway | regex_escape)
            ~ '[ \t]*\n(?:(?!^!).)* domain-name ' ~ (domain_name | regex_escape))
          - >-
            running.stdout[0] is search('(?m)^ip dhcp excluded-address ' ~ (item.gateway | regex_escape) ~ '(?: |$)')
          - >-
            running.stdout[0] is search('(?ms)^interface ' ~ (router_trunk_port | regex_escape) ~ '\.' ~ (item.id | string)
            ~ '\n(?:(?!^!).)* encapsulation dot1Q ' ~ (item.id | string)
            ~ '\n(?:(?!^!).)* ip address ' ~ (item.gateway | regex_escape) ~ ' ' ~ (lan_netmask | regex_escape))
          - >-
            running.stdout[0] is search('(?ms)^ip access-list standard 1\n(?:(?!^!).)*^ (?:[0-9]+ )?permit '
            ~ (item.network | regex_escape) ~ ' 0\.0\.0\.255$')
        fail_msg: DHCP-Pool, Maske, Gateway oder NAT-Zugriffsliste entspricht nicht dem VLAN-Adressplan.
      loop: "{{ vlans }}"
      register: pools
      ignore_errors: true

    - name: Öffentliche IP, Netzmaske und NAT-Konfiguration prüfen
      when: inventory_hostname in groups['routers']
      ansible.builtin.assert:
        that:
          - >-
            running.stdout[0] is search('(?ms)^interface ' ~ (router_internet_port | regex_escape)
            ~ '\n(?:(?!^!).)* ip address ' ~ (public_ip | regex_escape) ~ ' ' ~ (public_netmask | regex_escape)
            ~ '\n(?:(?!^!).)* ip nat outside')
          - "('ip nat inside source list 1 interface ' ~ router_internet_port ~ ' overload') in running.stdout[0]"
          - "running.stdout[0] | regex_findall('(?m)^ ip nat inside$') | length == 4"
          - "('ip dhcp excluded-address ' ~ (vlans | selectattr('id', 'equalto', 99) | first).gateway ~ ' ' ~ switch_management_ip) in running.stdout[0]"
        fail_msg: Öffentlicher Uplink, NAT-Zuordnung oder Reservierung der Management-Adressen fehlt.
      register: uplink
      ignore_errors: true

    - name: Genau die vier vorgesehenen DHCP-Netze im laufenden Router prüfen
      when: inventory_hostname in groups['routers']
      ansible.builtin.assert:
        that:
          - >-
            (running.stdout[0] | regex_findall('(?m)^ network (\S+) \S+') | sort)
            == (vlans | map(attribute='network') | sort)
        fail_msg: Die laufenden DHCP-Netze weichen von den vier geprüften VLAN-Netzen nach dem Schema 192.168.x.0/24 ab.
      register: address_range
      ignore_errors: true

    - name: Gesamtergebnis der Konfigurationsprüfung
      ansible.builtin.assert:
        that: >-
          [hostname_check, basics, bootstrap, passwords, vlan_check, ports, pools, uplink, address_range]
          | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
        fail_msg: Mindestens eine Konfigurationsanforderung ist nicht erfüllt; siehe Einzelprüfungen oben.

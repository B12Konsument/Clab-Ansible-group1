---
franchise_name: Echt Hamburg Franchise
group_name: Gruppe 1
# Echte Namen der Projektgruppe; werden automatisch in die Website übernommen.
group_members: [Florian, Jona, Sascha]
enable_password: echt-hamburg
lab_name: echt-hamburg
domain_name: echt-hamburg.de
# Öffentliche Resolver statt der nur im Hardware-Netz erreichbaren Schul-DNS.
dhcp_dns_servers: [1.1.1.1, 8.8.8.8]
# Feste DHCP-Zuordnung für die WAN-Portweiterleitungen (Option 61).
